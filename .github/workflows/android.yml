name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODEL: onnx-community/whisper-base
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }

      - name: Зібрати веб-частину
        run: |
          trap 'echo "::error::Збій на команді: $BASH_COMMAND"' ERR
          mkdir -p native/www
          cp -r index.html app.js rules.js asr-worker.js tap.js sw.js fonts.css manifest.webmanifest icon-192.png icon-512.png vendor fonts demo native/www/

      - name: Модель і рушій whisper.cpp
        run: |
          trap 'echo "::error::Збій на команді: $BASH_COMMAND"' ERR
          git clone -q --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp native/whisper.cpp
          mkdir -p native/ggml
          B=https://huggingface.co/ggerganov/whisper.cpp/resolve/main
          curl -fsSL "$B/ggml-base-q5_1.bin" -o native/ggml/ggml-base.bin || curl -fsSL "$B/ggml-base.bin" -o native/ggml/ggml-base.bin
          curl -fsSL "$B/ggml-tiny-q5_1.bin" -o native/ggml/ggml-tiny.bin || curl -fsSL "$B/ggml-tiny.bin" -o native/ggml/ggml-tiny.bin
          ls -la native/ggml

      - name: Capacitor → Android-проєкт
        working-directory: native
        run: |
          trap 'echo "::error::Збій на команді: $BASH_COMMAND"' ERR
          npm install
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application#' $M
          cat $M
          # іконка
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          cp -r res/. $R/
          # нативний рушій: джерела, моделі, збірка через CMake
          J=android/app/src/main/java/ua/efirai/app
          cp android-src/java/*.java $J/
          mkdir -p android/app/src/main/cpp android/app/src/main/assets/ggml
          cp android-src/cpp/* android/app/src/main/cpp/
          cp ggml/*.bin android/app/src/main/assets/ggml/
          NDKV=$(basename "${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}")
          echo "NDK: $NDKV"
          cat >> android/app/build.gradle <<GRADLE

          android {
              ${NDKV:+ndkVersion "$NDKV"}
              androidResources { noCompress += ["onnx", "wasm", "bin"] }
              defaultConfig {
                  ndk { abiFilters "arm64-v8a", "x86_64" }
                  externalNativeBuild { cmake { arguments "-DWHISPER_DIR=$PWD/whisper.cpp" } }
              }
              externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } }
          }
          GRADLE
          tail -12 android/app/build.gradle

      - name: Зібрати APK
        working-directory: native/android
        run: |
          trap 'echo "::error::Збій на команді: $BASH_COMMAND"' ERR
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log || { grep -E "error:|FAILED|What went wrong|^> " build.log | head -8 | while read l; do echo "::error::$l"; done; exit 1; }

      - name: Опублікувати APK
        run: |
          trap 'echo "::error::Збій на команді: $BASH_COMMAND"' ERR
          cp native/android/app/build/outputs/apk/debug/app-debug.apk efir-ai.apk
          ls -la efir-ai.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Ефір-ШІ — Android APK (остання збірка)
          body: |
            Тестова збірка прототипу. Встановлення: завантажте `efir-ai.apk` на Android і відкрийте файл (дозвольте встановлення з цього джерела).
            Модель розпізнавання вже всередині — мережа не потрібна. Перед оновленням видаліть попередню версію.
          files: efir-ai.apk
          make_latest: true

      - name: Тестова збірка із самоперевіркою
        working-directory: native/android
        run: |
          echo '{"autotest":true}' > app/src/main/assets/public/autotest.json
          ./gradlew --no-daemon assembleDebug -q
          cp app/build/outputs/apk/debug/app-debug.apk ../../efir-ai-test.apk
      - name: Увімкнути KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Самоперевірка на емуляторі Android
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash native/emutest.sh efir-ai-test.apk
