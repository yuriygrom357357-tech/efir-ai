name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODEL: onnx-community/whisper-base
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }

      - name: Зібрати веб-частину
        run: |
          trap 'echo "::error::Збій на команді: $BASH_COMMAND"' ERR
          mkdir -p native/www
          cp -r index.html app.js rules.js asr-worker.js tap.js sw.js fonts.css manifest.webmanifest icon-192.png icon-512.png vendor fonts demo native/www/

      - name: Вкласти модель розпізнавання (для роботи без мережі)
        run: |
          trap 'echo "::error::Збій на команді: $BASH_COMMAND"' ERR
          for MODEL in onnx-community/whisper-base onnx-community/whisper-tiny; do
          D=native/www/models/$MODEL
          mkdir -p $D/onnx
          B=https://huggingface.co/$MODEL/resolve/main
          for f in config.json generation_config.json preprocessor_config.json tokenizer.json tokenizer_config.json; do
            curl -fsSL "$B/$f" -o "$D/$f"
          done
          for f in added_tokens.json special_tokens_map.json vocab.json merges.txt normalizer.json; do
            curl -fsSL "$B/$f" -o "$D/$f" || rm -f "$D/$f"
          done
          for f in encoder_model.onnx decoder_model_merged_q4.onnx encoder_model_quantized.onnx decoder_model_merged_quantized.onnx; do
            curl -fsSL "$B/onnx/$f" -o "$D/onnx/$f"
          done
          done
          du -sh native/www/models/*/*

      - name: Capacitor → Android-проєкт
        working-directory: native
        run: |
          trap 'echo "::error::Збій на команді: $BASH_COMMAND"' ERR
          npm install
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application#' $M
          cat $M
          # іконка
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          cp -r res/. $R/
          # не стискати модель і wasm усередині APK
          printf '\nandroid { androidResources { noCompress += ["onnx", "wasm"] } }\n' >> android/app/build.gradle

      - name: Зібрати APK
        working-directory: native/android
        run: |
          trap 'echo "::error::Збій на команді: $BASH_COMMAND"' ERR
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log || { grep -E "error:|FAILED|What went wrong|^> " build.log | head -8 | while read l; do echo "::error::$l"; done; exit 1; }

      - name: Опублікувати APK
        run: |
          trap 'echo "::error::Збій на команді: $BASH_COMMAND"' ERR
          cp native/android/app/build/outputs/apk/debug/app-debug.apk efir-ai.apk
          ls -la efir-ai.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Ефір-ШІ — Android APK (остання збірка)
          body: |
            Тестова збірка прототипу. Встановлення: завантажте `efir-ai.apk` на Android і відкрийте файл (дозвольте встановлення з цього джерела).
            Модель розпізнавання вже всередині — мережа не потрібна. Перед оновленням видаліть попередню версію.
          files: efir-ai.apk
          make_latest: true

      - name: Тестова збірка із самоперевіркою
        working-directory: native/android
        run: |
          echo '{"autotest":true}' > app/src/main/assets/public/autotest.json
          ./gradlew --no-daemon assembleDebug -q
          cp app/build/outputs/apk/debug/app-debug.apk ../../efir-ai-test.apk
      - name: Увімкнути KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Самоперевірка на емуляторі Android
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash native/emutest.sh efir-ai-test.apk
